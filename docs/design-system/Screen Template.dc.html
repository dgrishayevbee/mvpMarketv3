<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300..700;1,7..72,400&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#F7F5F1; --bg-sunken:#EFEBE3; --surface:#FFFFFF; --surface-2:#FBFAF7;
  --border:#E7E1D7; --border-strong:#CFC8BA;
  --ink:#1A1A18; --ink-2:#57534C; --ink-3:#8B8579;
  --accent:#141413; --accent-hover:#333230; --accent-ink:#FFFFFF;
  --brand:#FFCC00; --brand-ink:#1A1A18;
  --success:#2C6A4C; --success-bg:#E7F0EA; --warning:#8A5710; --warning-bg:#FAEFD9;
  --error:#9A2A25; --error-bg:#F8E8E5; --info:#2D4F7A; --info-bg:#E8EEF6;
  --font-serif:"Literata",Georgia,serif; --font-sans:"Golos Text","Helvetica Neue",sans-serif;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px;
  --shadow-sm:0 1px 2px rgba(26,26,24,.04); --shadow-md:0 2px 6px rgba(26,26,24,.05),0 14px 30px -14px rgba(26,26,24,.12);
  --card-border:1px solid var(--border); --card-shadow:none;
  --pad-card:28px; --row-h:44px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;text-wrap:pretty;}
a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--border-strong);text-underline-offset:3px;}
a:hover{color:var(--accent);text-decoration-color:var(--ink-3);}
</style>
</helmet>

<div style="display:flex;flex-direction:column;min-height:100vh;">

  <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border);">
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:20px;height:20px;border-radius:5px;background:var(--brand);"></div>
      <span style="font-size:14px;font-weight:600;">Beeline Business</span>
      <span style="width:1px;height:18px;background:var(--border);margin:0 4px;"></span>
      <span style="font-size:14px;color:var(--ink-2);">ИП Ахметов А.</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--border);border-radius:var(--r-sm);min-width:180px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" stroke-width="1.5"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
        <input type="text" placeholder="Поиск" style="flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:var(--font-sans);font-size:13px;" />
      </div>
      <div style="width:32px;height:32px;border-radius:50%;background:var(--bg-sunken);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--ink-2);">АА</div>
    </div>
  </div>

  <div style="display:flex;align-items:stretch;flex:1 1 auto;min-height:0;">

    <div style="flex:0 0 206px;padding:18px 12px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:2px;">
      <span style="display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-sm);background:var(--bg-sunken);font-size:13px;font-weight:500;white-space:nowrap;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 20v-9l7-5 7 5v9z"></path></svg>Обзор</span>
      <span style="display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-sm);font-size:13px;color:var(--ink-2);white-space:nowrap;cursor:pointer;" style-hover="background:var(--bg-sunken);color:var(--ink);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M8 12h8"></path></svg>Мои сервисы</span>
      <span style="display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-sm);font-size:13px;color:var(--ink-2);white-space:nowrap;cursor:pointer;" style-hover="background:var(--bg-sunken);color:var(--ink);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M3 10h18"></path></svg>Платежи</span>
      <span style="display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-sm);font-size:13px;color:var(--ink-2);white-space:nowrap;cursor:pointer;" style-hover="background:var(--bg-sunken);color:var(--ink);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M7 4h7l4 4v12H7z"></path><path d="M14 4v4h4"></path></svg>Документы</span>
    </div>

    <div style="flex:1 1 0;min-width:0;padding:32px;display:flex;flex-direction:column;gap:24px;max-width:1180px;">

      <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;">
        <div style="display:flex;flex-direction:column;gap:4px;">
          <div style="display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-3);">
            <span>Раздел</span><span>/</span><span style="color:var(--ink);">Экран</span>
          </div>
          <h1 style="margin:0;font-family:var(--font-serif);font-weight:400;font-size:32px;line-height:1.15;letter-spacing:-0.02em;">Заголовок экрана</h1>
          <span style="font-size:14px;color:var(--ink-2);">Одна строка о том, что здесь делают.</span>
        </div>
        <div style="display:flex;gap:10px;">
          <button style="height:38px;padding:0 14px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface);font-family:var(--font-sans);font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;" style-hover="background:var(--bg-sunken);">Второе действие</button>
          <button style="height:38px;padding:0 16px;border:none;border-radius:var(--r-sm);background:var(--accent);color:var(--accent-ink);font-family:var(--font-sans);font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;" style-hover="background:var(--accent-hover);">Основное действие</button>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start;">
        <div style="background:var(--surface);border:var(--card-border);box-shadow:var(--card-shadow);border-radius:var(--r-lg);padding:var(--pad-card);display:flex;flex-direction:column;gap:12px;transition:box-shadow .18s,border-color .18s;" style-hover="border-color:var(--border-strong);box-shadow:var(--shadow-sm);">
          <span style="font-size:13px;font-weight:600;">Блок контента</span>
          <span style="font-size:14px;line-height:1.5;color:var(--ink-2);">Заменить содержимым экрана. Сниппеты компонентов — в DS-BASE.md.</span>
        </div>
        <div style="background:var(--surface);border:var(--card-border);box-shadow:var(--card-shadow);border-radius:var(--r-lg);padding:var(--pad-card);display:flex;flex-direction:column;gap:12px;transition:box-shadow .18s,border-color .18s;" style-hover="border-color:var(--border-strong);box-shadow:var(--shadow-sm);">
          <span style="font-size:13px;font-weight:600;">Блок контента</span>
          <span style="font-size:14px;line-height:1.5;color:var(--ink-2);">Плотность: отступы внутри 20–28px, между блоками 24–32px.</span>
        </div>
      </div>

    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}"></script>
</body>
</html>
